# Push a tag matching apps/desktop/package.json "version" (e.g. v0.1.0) to build the Windows
# installer and attach it to a GitHub Release. The web download button links to the latest one.
name: Release desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist -w @lol/desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
